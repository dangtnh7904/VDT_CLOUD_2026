x-backend-build: &backend-build
  context: ./backend
  network: host

x-backend-environment: &backend-environment
  DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL to a PostgreSQL URL reachable from Docker}
  CORPUS_MIXED_ROOT: /data/mix-file-corpus
  CORPUS_SIZE_ROOT: /data/size-file-corpus
  RBD_EXECUTOR_URL: http://rbd-console:3001

x-host-database: &host-database
  - "host.docker.internal:host-gateway"

services:
  # Disabled by default. The normal stack connects to PostgreSQL on the host.
  postgres:
    profiles: ["bundled-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${BUNDLED_POSTGRES_USER:-rgw}
      POSTGRES_PASSWORD: ${BUNDLED_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${BUNDLED_POSTGRES_DB:-rgw_console}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: *backend-build
    command: ["python", "-m", "app.migrate", "--wait-seconds", "60"]
    env_file: .env
    environment: *backend-environment
    extra_hosts: *host-database
    restart: "no"

  backend:
    build: *backend-build
    env_file: .env
    environment: *backend-environment
    extra_hosts: *host-database
    volumes:
      - ../data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: *backend-build
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment: *backend-environment
    extra_hosts: *host-database
    volumes:
      - ../data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  performance-collector:
    build: *backend-build
    command: ["python", "-m", "app.performance_collector"]
    env_file: .env
    environment: *backend-environment
    extra_hosts: *host-database
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Internal-only SSH executor. No port is published to the host or browser.
  rbd-console:
    profiles: ["ceph-ssh"]
    build:
      context: ./rbd-console
      network: host
    env_file: .env
    environment:
      RBD_SSH_KEY_PATH: /run/secrets/rbd_ssh_key
      RBD_EXECUTOR_STATE_ROOT: /var/lib/rbd-executor
    volumes:
      - ${RBD_SSH_PRIVATE_KEY_FILE:-./runtime/id_rsa}:/run/secrets/rbd_ssh_key:ro
      - rbd-executor-state:/var/lib/rbd-executor
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # Both workers use the same authenticated, FSID-bound Node SSH executor.
  capacity-collector:
    profiles: ["ceph-ssh"]
    build: *backend-build
    command: ["python", "-m", "app.capacity_collector"]
    env_file: .env
    environment: *backend-environment
    extra_hosts: *host-database
    depends_on:
      migrate:
        condition: service_completed_successfully
      rbd-console:
        condition: service_healthy
    restart: unless-stopped

  rbd-lifecycle-worker:
    profiles: ["ceph-ssh"]
    build: *backend-build
    command: ["python", "-m", "app.rbd_lifecycle_worker"]
    env_file: .env
    environment: *backend-environment
    extra_hosts: *host-database
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
      rbd-console:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      network: host
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  rbd-executor-state:
