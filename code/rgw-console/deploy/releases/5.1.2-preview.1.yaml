fixes:
  - Observe/export ASGI disconnect signals cooperative cancellation; pending source commands and waiting collection slots are cancelled.
  - Active collection slot stays held until its admitted bounded HTTP source calls settle; no global result cache or concurrency-limit inflation.
  - Shallow observation/export aggregate deadline is 60 seconds; deep uses 60 seconds plus configured collector budget.
  - Opening the inventory reads a shallow live catalogue; deep data is obtained on explicit selected-daemon detail, export or persisted As-is creation.
  - Selected metric daemons have explicit fresh-view and export buttons; results appear next to the actions without shrinking the catalogue.
  - Long source/provenance/limitation blocks replaced by a small accessible warning with concise missing or stale data summary.
  - Mixed collections match any contained daemon type; filtered row/detail/count/export show only matching daemons; whole original export remains separate.
  - Exact daemon-key filter scopes both saved exports and comparison; original collection payload/checksum remains immutable.
