limitations:
  - Cancellation stops pending backend commands; already-running SSH commands on the executor still finish under their own timeouts, not instantly.
  - The bounded two-active/two-wait queue can still return 429 under genuine excess concurrent demand; the single cancellation smoke test is not a long-duration load acceptance.
  - Worker security and historical integration stability gates from prior manifests remain open; no production promotion is claimed.
  - Browser checks cover selected metrics, downloads, saved mixed-daemon filters and comparison; they do not certify all OSDMap, collection mutation or production workflows.
