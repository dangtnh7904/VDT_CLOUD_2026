name: ${COMPOSE_PROJECT_NAME:-storage-lab-console-production}

x-production-environment: &production-environment
  APP_ENV: production
  EXECUTION_ENVIRONMENT: production
  CONSOLE_READ_ONLY: "true"
  FEATURE_LEGACY_RGW: "false"
  FEATURE_LEGACY_RBD: "false"
  FEATURE_LAB: "false"
  UPGRADE_MUTATIONS_ENABLED: "false"
  LAB_ALLOW_WRITE: "false"
  RBD_TERMINAL_ENABLED: "false"
  CAPACITY_OBSERVE_ONLY: "true"
  DATABASE_URL_FILE: /run/secrets/database_url
  CONSOLE_AUTH_PASSWORD_HASH_FILE: /run/secrets/console_password_hash
  CLUSTER_CONFIG_PATH: /etc/storage-lab-console/profiles/production.yaml
  EVIDENCE_STORE: filesystem
  EVIDENCE_ROOT: /var/lib/storage-lab-console/evidence

x-application: &application
  image: ${STORAGE_LAB_CONSOLE_IMAGE:?Set the tested application digest}
  pull_policy: ${RELEASE_PULL_POLICY:-never}
  env_file: ["${RUNTIME_ENV_FILE:-.env}"]
  environment: *production-environment
  networks: [control]
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  stop_grace_period: 45s
  restart: unless-stopped

x-database-secret: &database-secret
  source: database_url
  target: database_url
  uid: "10001"
  gid: "10001"
  mode: 0400

x-password-hash-secret: &password-hash-secret
  source: console_password_hash
  target: console_password_hash
  uid: "10001"
  gid: "10001"
  mode: 0400

x-token-secret: &token-secret
  source: executor_token
  target: executor_token
  uid: "10001"
  gid: "10001"
  mode: 0400

services:
  postgres:
    profiles: [bundled-db]
    image: ${POSTGRES_IMAGE:?Set the tested PostgreSQL digest}
    pull_policy: ${RELEASE_PULL_POLICY:-never}
    environment:
      POSTGRES_USER: storage_lab_console
      POSTGRES_DB: storage_lab_console
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U storage_lab_console -d storage_lab_console"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *application
    command: [migrate, --wait-seconds, "90"]
    environment:
      <<: *production-environment
      DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets:
      - {source: migration_database_url, target: migration_database_url, uid: "10001", gid: "10001", mode: 0400}
      - *password-hash-secret
    volumes: ["./config:/etc/storage-lab-console:ro"]
    restart: "no"

  database-permissions:
    <<: *application
    command: [configure-database]
    environment:
      <<: *production-environment
      DATABASE_URL_FILE: /run/secrets/migration_database_url
      DATABASE_RUNTIME_PASSWORD_FILE: /run/secrets/database_runtime_password
    secrets:
      - {source: migration_database_url, target: migration_database_url, uid: "10001", gid: "10001", mode: 0400}
      - {source: database_runtime_password, target: database_runtime_password, uid: "10001", gid: "10001", mode: 0400}
      - *password-hash-secret
    volumes: ["./config:/etc/storage-lab-console:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  api:
    <<: *application
    command: [api]
    environment:
      <<: *production-environment
      CEPH_EXECUTOR_URL: http://executor:3001
      RBD_EXECUTOR_URL: http://executor:3001
      CEPH_EXECUTOR_TOKEN_FILE: /run/secrets/executor_token
      RBD_EXECUTOR_TOKEN_FILE: /run/secrets/executor_token
    secrets: [*database-secret, *password-hash-secret, *token-secret]
    volumes:
      - ./config:/etc/storage-lab-console:ro
      - evidence:/var/lib/storage-lab-console/evidence
    depends_on:
      database-permissions: {condition: service_completed_successfully}
    # Dependency readiness is authenticated. Liveness alone is used for the
    # container watchdog; operators check /api/ready through the TLS ingress.
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/live', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  ingress:
    image: ${INGRESS_IMAGE:?Set the tested Nginx image digest}
    pull_policy: ${RELEASE_PULL_POLICY:-never}
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: ["./nginx/production.conf:/etc/nginx/nginx.conf:ro"]
    secrets:
      - {source: tls_certificate, target: tls_certificate, uid: "101", gid: "101", mode: 0444}
      - {source: tls_private_key, target: tls_private_key, uid: "101", gid: "101", mode: 0400}
    networks: [control]
    ports: ["${CONSOLE_BIND_ADDRESS:-127.0.0.1}:${CONSOLE_HTTPS_PORT:-8443}:8443"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  executor:
    <<: *application
    profiles: [ceph-readonly]
    command: [executor]
    environment:
      APP_ENV: production
      CONSOLE_READ_ONLY: "true"
      UPGRADE_MUTATIONS_ENABLED: "false"
      RBD_TERMINAL_ENABLED: "false"
      CEPH_EXECUTOR_TOKEN_FILE: /run/secrets/executor_token
      RBD_EXECUTOR_TOKEN_FILE: /run/secrets/executor_token
      RBD_SSH_KEY_PATH: /run/secrets/ssh_private_key
      RBD_SSH_KNOWN_HOSTS_PATH: /run/secrets/ssh_known_hosts
      RBD_EXECUTOR_STATE_ROOT: /var/lib/rbd-executor
    secrets:
      - *token-secret
      - {source: ssh_private_key, target: ssh_private_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: ssh_known_hosts, target: ssh_known_hosts, uid: "10001", gid: "10001", mode: 0400}
    volumes: ["executor-state:/var/lib/rbd-executor"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  capacity-collector:
    <<: *application
    profiles: [ceph-readonly]
    command: [capacity-collector]
    environment:
      <<: *production-environment
      CEPH_EXECUTOR_URL: http://executor:3001
      RBD_EXECUTOR_URL: http://executor:3001
      CEPH_EXECUTOR_TOKEN_FILE: /run/secrets/executor_token
      RBD_EXECUTOR_TOKEN_FILE: /run/secrets/executor_token
    secrets: [*database-secret, *password-hash-secret, *token-secret]
    volumes: ["./config:/etc/storage-lab-console:ro"]
    depends_on:
      database-permissions: {condition: service_completed_successfully}
      executor: {condition: service_healthy}

  performance-collector:
    <<: *application
    profiles: [collectors]
    command: [performance-collector]
    secrets: [*database-secret, *password-hash-secret]
    volumes: ["./config:/etc/storage-lab-console:ro"]
    depends_on:
      database-permissions: {condition: service_completed_successfully}

networks:
  control: {driver: bridge}

volumes:
  postgres-data:
  evidence:
  executor-state:

secrets:
  database_url: {file: ./secrets/database_url}
  migration_database_url: {file: ./secrets/migration_database_url}
  database_runtime_password: {file: ./secrets/database_runtime_password}
  console_password_hash: {file: ./secrets/console_password_hash}
  executor_token: {file: ./secrets/executor_token}
  postgres_password: {file: ./secrets/postgres_password}
  tls_certificate: {file: ./secrets/tls_certificate.pem}
  tls_private_key: {file: ./secrets/tls_private_key.pem}
  ssh_private_key: {file: ./secrets/ssh_private_key}
  ssh_known_hosts: {file: ./secrets/ssh_known_hosts}
