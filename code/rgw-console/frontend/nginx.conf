server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 0;
  proxy_request_buffering off;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location / { try_files $uri /index.html; }
}
